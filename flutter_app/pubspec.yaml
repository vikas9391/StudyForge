name: studyforge
description: AI-powered study assistant — summarise, quiz, and flashcard your documents.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.10+1

  app_links: ^6.3.2

  google_sign_in: ^6.2.1

  # HTTP client (Dio for API calls)
  dio: ^5.4.3+1

  # Plain HTTP (used by auth_service.dart for signup/signin)
  http: ^1.2.1

  # File picking
  file_picker: ^8.0.3

  # Beautiful fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Toast messages
  fluttertoast: ^8.2.4

  # Env file loading
  flutter_dotenv: ^5.1.0

  # Local storage — stores JWT token + user_id after login
  shared_preferences: ^2.2.3

  # Image picking (avatar upload)
  image_picker: ^1.1.2

  # Confetti burst on first upload
  confetti: ^0.7.0

  # Offline banner / connectivity detection
  connectivity_plus: ^6.0.3

  # URL launcher
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/studyforge_logo.png"
  adaptive_icon_background: "#F8F5F0"
  adaptive_icon_foreground: "assets/images/studyforge_logo_fg.png"
  web:
    generate: true
    image_path: "assets/images/studyforge_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/studyforge_logo.svg
    - assets/images/studyforge_logo.png