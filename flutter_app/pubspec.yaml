name: studyforge
description: AI-powered study assistant — summarise, quiz, and flashcard your documents.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase — replaces Firebase, free tier, no credit card needed
  supabase_flutter: ^2.5.3

  # File picking
  file_picker: ^8.0.3

  # HTTP client
  dio: ^5.4.3+1

  # Beautiful fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Toast messages
  fluttertoast: ^8.2.4

  # Env file loading
  flutter_dotenv: ^5.1.0

  # Local storage
  shared_preferences: ^2.2.3

  # Image picking for profile avatar (optional)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
